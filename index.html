@media(min-aspect-ratio:3/4){.scene img{object-fit:contain;background:#210b12}main{padding-top:63vh;padding-top:63svh}h1{font-size:clamp(26px,3.4vw,42px)}}@media(max-width:350px){h1{font-size:22px;letter-spacing:.03em}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
