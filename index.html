<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ead7ef">
<meta name="description" content="刘夏维，天下第一美！">
<title>刘夏维，天下第一美！</title>
<style>
*{box-sizing:border-box}html{min-height:100%;background:#ead7ef}body{margin:0;color:#65395d;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(ellipse at 12% 8%,#fff4e9 0,transparent 46%),radial-gradient(ellipse at 90% 85%,#c8b7ef 0,transparent 52%),linear-gradient(145deg,#fbe0e7,#ecd8ef 55%,#e0d9f6);min-height:100vh;min-height:100svh;overflow-x:hidden}button{font:inherit}main{position:relative;z-index:1;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:52px 24px 32px;padding-top:max(52px,env(safe-area-inset-top));padding-bottom:max(32px,env(safe-area-inset-bottom));text-align:center}.eyebrow{font-size:11px;letter-spacing:5px;font-weight:600;margin:0 0 32px;color:#946c89}.emblem{position:relative;width:100px;height:100px;display:grid;place-items:center;margin:0 auto 24px;border:1px solid #fff9;border-radius:50%;box-shadow:0 0 0 13px #ffffff20,0 0 0 14px #ffffff40}.emblem svg{width:48px;fill:#c5789c;filter:drop-shadow(0 5px 10px #bc739b40)}.spark{position:absolute;font-size:22px;color:#b28ab9;right:-19px;top:3px}.dedication{font-size:14px;letter-spacing:3px;margin:12px 0 16px;color:#916d88}h1{font-family:"Songti SC","STSong","SimSun",serif;font-weight:500;line-height:1.5;letter-spacing:3px;font-size:clamp(34px,8vw,58px);margin:0;color:#69385f}h1 span{display:block}h1 .name{font-size:.78em;letter-spacing:7px}.sub{font-size:14px;line-height:1.9;color:#927089;margin:22px 0 32px}.letter{width:min(100%,440px);padding:26px 22px 22px;background:#fff6;border:1px solid #fffc;border-radius:24px;box-shadow:0 18px 55px #775b8c0b}.letter-label{font-size:10px;letter-spacing:4px;color:#a47e96;margin:0 0 17px}.message{font-family:"Songti SC","STSong","SimSun",serif;font-size:19px;line-height:1.9;margin:0 0 22px;min-height:74px;display:flex;align-items:center;justify-content:center;white-space:pre-line}button{min-height:50px;padding:14px 27px;border:0;border-radius:30px;background:#815377;color:white;box-shadow:0 6px 18px #81537725;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .2s,background .2s}button:hover{background:#714268}button:active{transform:scale(.97)}button:focus-visible{outline:3px solid #ad7097;outline-offset:5px}.hint{font-size:11px;color:#987b92;letter-spacing:1px;margin:16px 0 0}footer{font-size:10px;letter-spacing:3px;color:#9e8099;margin-top:35px}.hearts{position:fixed;inset:0;overflow:hidden;pointer-events:none}.heart{position:absolute;top:-45px;color:#ce8aa9;opacity:0;animation:fall linear infinite;will-change:transform}.burst{position:fixed;z-index:2;color:#bf709a;pointer-events:none;animation:burst 1s ease-out forwards}@keyframes fall{0%{transform:translate3d(0,-30px,0) rotate(-15deg);opacity:0}12%{opacity:.35}85%{opacity:.35}100%{transform:translate3d(35px,110vh,0) rotate(40deg);opacity:0}}@keyframes burst{from{transform:translate(-50%,-50%) scale(.7);opacity:.8}to{transform:translate(calc(-50% + var(--x)),calc(-50% - 100px)) scale(1.3);opacity:0}}@media(max-width:360px){main{padding-left:18px;padding-right:18px}.eyebrow{letter-spacing:3px}.letter{padding:24px 15px}.message{font-size:17px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.hearts,.burst{display:none}}
</style>
</head>
<body>
<div class="hearts" id="hearts" aria-hidden="true"></div>
<main>
<h1 id="message" aria-live="polite" aria-atomic="true">刘夏维，天下第一美！</h1>
<button id="love" type="button" aria-label="点击这里，显示下一句" style="margin-top:36px">♡ 点击这里</button>
</main>
<script>
(function () {
  'use strict';
  var button = document.getElementById('love');
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
  if (!reduced || !reduced.matches) {
    for (var i = 0; i < 16; i++) {
      var heart = document.createElement('span');
      heart.className = 'heart';
      heart.textContent = '♡';
      heart.style.left = (i * 6.25) + '%';
      heart.style.fontSize = (14 + i % 4 * 5) + 'px';
      heart.style.animationDuration = (13 + i % 5 * 2) + 's';
      heart.style.animationDelay = (-i * 1.7) + 's';
      document.getElementById('hearts').appendChild(heart);
    }
  }
  button.addEventListener('click', function () {
    document.getElementById('message').textContent = '也是天下第一好';
    document.title = '也是天下第一好';
    button.hidden = true;
  });
})();
</script>
</body>
</html>
